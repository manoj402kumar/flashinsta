<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGlow4" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#14181f"/>
      <stop offset="100%" stop-color="#09090b"/>
    </radialGradient>
  </defs>
  <!-- Card Background -->
  <rect width="512" height="512" rx="64" fill="url(#bgGlow4)"/>
  <rect x="1" y="1" width="510" height="510" rx="63" fill="none" stroke="#27272a" stroke-width="2"/>
  
  <!-- Option 4: Minimal Camera Aperture + Flash Ring -->
  <g transform="translate(136, 75)">
    <!-- Outer Aperture Ring with Gap -->
    <circle cx="120" cy="120" r="105" fill="none" stroke="#ffffff" stroke-width="16" stroke-linecap="round" stroke-dasharray="540 120" />
    <!-- Yellow Electric Accent Orbit -->
    <circle cx="210" cy="40" r="16" fill="#FFE14D" />
    <!-- Center Lightning Strike Blade -->
    <path fill="#FFE14D" d="
      M 135,45
      L 75,130
      L 115,130
      L 95,200
      L 170,110
      L 125,110
      Z
    "/>
  </g>
  
  <text x="256" y="420" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">OPTION 4</text>
  <text x="256" y="456" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="600" fill="#38BDF8" text-anchor="middle">THE APERTURE SPARK</text>
  <text x="256" y="482" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#a1a1aa" text-anchor="middle">Minimalist Optics + Electric Orbit Core</text>
</svg>
