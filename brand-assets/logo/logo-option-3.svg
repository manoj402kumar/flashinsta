<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGlow3" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </radialGradient>
    <linearGradient id="amberGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE14D"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
  </defs>
  <!-- Card Background -->
  <rect width="512" height="512" rx="64" fill="url(#bgGlow3)"/>
  <rect x="1" y="1" width="510" height="510" rx="63" fill="none" stroke="#27272a" stroke-width="2"/>
  
  <!-- Option 3: Monogram F (Kinetic Chevrons) -->
  <g transform="translate(146, 80)">
    <!-- Top Speed Bar -->
    <path fill="url(#amberGold)" d="M 0,0 L 210,0 L 175,54 L 0,54 Z" />
    <!-- Middle Speed Bar -->
    <path fill="url(#amberGold)" d="M 0,84 L 145,84 L 110,138 L 0,138 Z" opacity="0.9" />
    <!-- Angular Lightning Stem / Arrow -->
    <polygon fill="#ffffff" points="0,0 48,0 48,160 110,160 0,240" />
  </g>
  
  <text x="256" y="420" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">OPTION 3</text>
  <text x="256" y="456" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="600" fill="#F59E0B" text-anchor="middle">THE KINETIC MONOGRAM</text>
  <text x="256" y="482" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#a1a1aa" text-anchor="middle">Speed Chevrons + Sculpted Letter 'F'</text>
</svg>
