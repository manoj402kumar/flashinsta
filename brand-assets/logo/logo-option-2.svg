<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGlow2" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#18121a"/>
      <stop offset="100%" stop-color="#09090b"/>
    </radialGradient>
    <linearGradient id="igSunset" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFDC80"/>
      <stop offset="25%" stop-color="#FCAF45"/>
      <stop offset="50%" stop-color="#F77737"/>
      <stop offset="75%" stop-color="#FD1D1D"/>
      <stop offset="100%" stop-color="#833AB4"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Card Background -->
  <rect width="512" height="512" rx="64" fill="url(#bgGlow2)"/>
  <rect x="1" y="1" width="510" height="510" rx="63" fill="none" stroke="#27272a" stroke-width="2"/>
  
  <!-- Option 2: The Neon Prism -->
  <g transform="translate(136, 80)">
    <!-- Instagram Squircle Badge with Sunset Gradient -->
    <rect x="0" y="0" width="240" height="240" rx="64" fill="url(#igSunset)" />
    <!-- Camera Corner Dot -->
    <circle cx="188" cy="52" r="14" fill="#ffffff" opacity="0.95"/>
    <!-- Pure White Center Lightning Cutout -->
    <path fill="#ffffff" filter="url(#softGlow)" d="
      M 136,36
      L 76,122
      L 116,122
      L 98,198
      L 168,104
      L 126,104
      Z
    "/>
  </g>
  
  <text x="256" y="420" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">OPTION 2</text>
  <text x="256" y="456" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="600" fill="#FCAF45" text-anchor="middle">THE NEON PRISM</text>
  <text x="256" y="482" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#a1a1aa" text-anchor="middle">Official Instagram Sunset + Luminescent Bolt</text>
</svg>
