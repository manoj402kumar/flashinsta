name: CI Production Quality Gate

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate-and-build:
    name: Typecheck, Test & Production Build
    runs-on: ubuntu-latest

    env:
      NODE_ENV: production
      NEXT_PUBLIC_APP_URL: "https://insta-p8-fawn.vercel.app"
      NEXT_PUBLIC_SUPABASE_URL: "https://mock.supabase.co"
      NEXT_PUBLIC_SUPABASE_ANON_KEY: "mock-anon-key"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Restore Next.js Build Cache
        uses: actions/cache@v4
        with:
          path: |
            .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('**/*.ts', '**/*.tsx', '**/*.js', '**/*.jsx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-

      - name: Install Dependencies
        run: npm ci

      - name: Verify TypeScript Types
        run: npm run typecheck

      - name: Run Hermetic Test Suite
        run: npm test

      - name: Compile Next.js Production Build
        run: npm run build
